spring:
  application:
    name: flash-sale-engine

  # PostgreSQL Data Source Configuration
  datasource:
    url: jdbc:postgresql://localhost:5433/flashsaledb
    username: flashuser
    password: flashpassword
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  # Redis Configuration
  data:
    redis:
      host: localhost
      port: 6379

  # Apache Kafka Configuration
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: flash-sale-order-processors
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.flashsale.*"
        spring.json.value.default.type: com.flashsale.order.event.OrderEventProducer$OrderCreatedEvent
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
    listener:
      ack-mode: MANUAL_IMMEDIATE
  server:
    port: 8080

  # Isolate management endpoints on a dedicated internal port for security and resource isolation
  management:
    server:
      port: 8081
    endpoints:
      web:
        exposure:
          include: "health,prometheus,metrics,info"
        base-path: "/actuator"
    endpoint:
      health:
        show-details: "when_authorized"
        roles: "ROLE_ACTUATOR"
        probes:
          enabled: true # Enables K8s liveness (/actuator/health/liveness) and readiness (/actuator/health/readiness)
        # CRITICAL FOR HIGH TPS: Caching prevents health scraping storms from hammering PostgreSQL/Redis/Kafka
        cache:
          time-to-live: 5s
      prometheus:
        access: "read_only"

    health:
      db:
        enabled: true
      redis:
        enabled: true
      kafka:
        enabled: false # Disabled default auto-config to use optimized custom indicator below

    metrics:
      tags:
        application: ${spring.application.name:flash-sale-engine}
        env: ${SPRING_PROFILES_ACTIVE:prod}
      distribution:
        percentiles-histogram:
          http.server.requests: true
          resilience4j.circuitbreaker.calls: true
        sla:
          http.server.requests: 10ms, 50ms, 100ms, 200ms, 500ms